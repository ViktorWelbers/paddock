name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The shipped Rego, tested with Rego. A rule that matches nothing looks
      # exactly like a rule that works, so this is not optional.
      - run: make policy-test

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/paddock
      - run: helm template paddock deploy/helm/paddock --set auth.disabled=true > /dev/null
      # Exercise the conditional blocks: pi agent, openai upstream, ingress, PVC.
      - run: >
          helm template paddock deploy/helm/paddock
          --set auth.existingSecret=paddock-api-tokens
          --set agentImagePi=example/agent-pi:ci
          --set gateway.openai.upstream=http://models.svc
          --set gateway.openai.model=example/model
          --set gateway.openai.caConfigMap=openai-ca
          --set ingress.enabled=true --set ingress.tls.enabled=true
          --set persistence.enabled=true > /dev/null
      # A self-hosted-models-only install must not need an Anthropic secret.
      - name: renders without an Anthropic key
        run: >
          helm template paddock deploy/helm/paddock
          --set auth.disabled=true
          --set gateway.existingSecret=
          --set agentImagePi=example/agent-pi:ci
          --set gateway.openai.upstream=http://models.svc
          --set gateway.openai.model=example/model > /dev/null
      # ...and an install with no model upstream at all must fail loudly.
      - name: refuses an install with no model upstream
        run: |
          if helm template paddock deploy/helm/paddock --set auth.disabled=true --set gateway.existingSecret= >/dev/null 2>&1; then
            echo "expected the chart to reject a gateway with no model upstream"
            exit 1
          fi
      # Authentication is a decision the operator has to make out loud.
      - name: refuses an install that never chose an auth mode
        run: |
          if helm template paddock deploy/helm/paddock >/dev/null 2>&1; then
            echo "expected the chart to reject an install with no auth configured"
            exit 1
          fi

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t paddock:ci .
      - run: docker build -t paddock-agent-pi:ci -f Dockerfile.agent-pi .
      # Dockerfile.agent (Claude Code) is exercised too; it's the slowest, last.
      - run: docker build -t paddock-agent-claude:ci -f Dockerfile.agent .
