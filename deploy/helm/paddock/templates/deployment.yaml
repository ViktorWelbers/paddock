# Server and gateway share one pod because MVP storage is a single SQLite
# file. Postgres support (roadmap M3) unlocks separate deployments.
{{- if and (not .Values.gateway.existingSecret) (not .Values.gateway.openai.upstream) }}
  {{- fail "paddock: the gateway has no model upstream. Set gateway.existingSecret (a Secret holding ANTHROPIC_API_KEY) or gateway.openai.upstream (an OpenAI-compatible endpoint)." }}
{{- end }}
{{- if and (not .Values.auth.existingSecret) (not .Values.auth.disabled) }}
  {{- fail "paddock: the API has no authentication. Set auth.existingSecret (a Secret holding tokens.json) or, if you really mean to serve the API to anyone who can reach it, auth.disabled=true." }}
{{- end }}
{{- if and .Values.auth.existingSecret .Values.auth.disabled }}
  {{- fail "paddock: auth.existingSecret and auth.disabled contradict each other; pick one." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: paddock
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # SQLite: never two writers
  selector:
    matchLabels:
      app.kubernetes.io/name: paddock
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: paddock
        app.kubernetes.io/instance: {{ .Release.Name }}
        # Sandbox NetworkPolicies select this label as their only egress peer.
        paddock.dev/component: gateway
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # distroless :nonroot uid; fsGroup lets it write the SQLite volume.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # Paddock asks operators to run agents under Pod Security Admission's
        # "restricted" profile, so its own control plane meets it too — the
        # chart installs into a restricted namespace unchanged.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | toString }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "paddock.containerSecurityContext" . | nindent 12 }}
          command: ["/paddock-server"]
          args:
            - --addr=:{{ .Values.server.port }}
            - --db=/data/paddock.db
            - --agent-image={{ .Values.agentImage }}
            {{- if .Values.agentImagePi }}
            - --agent-images=pi={{ .Values.agentImagePi }}
            {{- end }}
            - --gateway-url=http://{{ .Release.Name }}-gateway.{{ .Release.Namespace }}.svc:{{ .Values.gateway.port }}/anthropic
            - --openai-gateway-url=http://{{ .Release.Name }}-gateway.{{ .Release.Namespace }}.svc:{{ .Values.gateway.port }}/openai/v1
            {{- if .Values.gateway.openai.model }}
            - --openai-model={{ .Values.gateway.openai.model }}
            {{- end }}
            {{- if .Values.gateway.egress.enabled }}
            - --egress-proxy-url=http://{{ .Release.Name }}-gateway.{{ .Release.Namespace }}.svc:{{ .Values.gateway.egress.port }}
            {{- end }}
            - --workspace-size-limit={{ .Values.server.workspaceSizeLimit }}
            {{- with .Values.sandbox.claudeOAuthSecret }}
            - --claude-oauth-secret={{ . }}
            {{- end }}
            {{- with .Values.sandbox.nodeSelector }}
            - --sandbox-node-selector={{ toJson . }}
            {{- end }}
            {{- with .Values.sandbox.tolerations }}
            - --sandbox-tolerations={{ toJson . }}
            {{- end }}
            {{- with .Values.sandbox.runtimeClassName }}
            - --sandbox-runtime-class={{ . }}
            {{- end }}
            {{- with .Values.sandbox.priorityClassName }}
            - --sandbox-priority-class={{ . }}
            {{- end }}
            # Sandboxes are pods in this namespace; the provisioner Role is
            # bound here and nowhere else.
            - --sandbox-namespace={{ .Release.Namespace }}
            - --seed-budget-usd={{ .Values.server.seedBudgetUSD }}
            {{- with .Values.server.maxSessionAge }}
            - --max-session-age={{ . }}
            {{- end }}
            {{- if .Values.auth.existingSecret }}
            - --auth-tokens=/auth/tokens.json
            {{- else }}
            - --auth-disabled
            {{- end }}
          ports:
            - containerPort: {{ .Values.server.port }}
          # Readiness is deep (the database must answer), liveness shallow (is
          # the process up): a DB blip should drain traffic, not restart the pod
          # into a crashloop that cannot fix a database.
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.server.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.server.port }}
            initialDelaySeconds: 5
          {{- with .Values.server.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.auth.existingSecret }}
            - name: auth
              mountPath: /auth
              readOnly: true
            {{- end }}
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | toString }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "paddock.containerSecurityContext" . | nindent 12 }}
          command: ["/paddock-gateway"]
          args:
            - --addr=:{{ .Values.gateway.port }}
            - --db=/data/paddock.db
            - --upstream-anthropic={{ .Values.gateway.upstreamAnthropic }}
            {{- if .Values.gateway.openai.upstream }}
            - --upstream-openai={{ .Values.gateway.openai.upstream }}
            {{- if .Values.gateway.openai.caConfigMap }}
            - --upstream-openai-ca=/openai-ca/ca.crt
            {{- end }}
            {{- end }}
            - --policies=/policies
            {{- if .Values.gateway.mcpRegistry.servers }}
            - --mcp-registry=/mcp/registry.json
            {{- end }}
            {{- if .Values.gateway.egress.enabled }}
            - --egress-addr=:{{ .Values.gateway.egress.port }}
            - --egress-allowlist=/egress/allowlist.json
            {{- end }}
          {{- if or .Values.gateway.existingSecret .Values.gateway.openai.existingSecret }}
          env:
            {{- if .Values.gateway.existingSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: ANTHROPIC_API_KEY
            {{- end }}
            {{- if .Values.gateway.openai.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.openai.existingSecret }}
                  key: OPENAI_API_KEY
            {{- end }}
          {{- end }}
          {{- if .Values.gateway.mcpRegistry.credentialsSecret }}
          envFrom:
            # MCP server credentials, referenced by credential_env in the
            # registry. Brokered gateway-side; never visible to sandboxes.
            - secretRef:
                name: {{ .Values.gateway.mcpRegistry.credentialsSecret }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
            {{- if .Values.gateway.egress.enabled }}
            - containerPort: {{ .Values.gateway.egress.port }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.gateway.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 5
          {{- with .Values.gateway.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: policies
              mountPath: /policies
              readOnly: true
            {{- if .Values.gateway.egress.enabled }}
            - name: egress
              mountPath: /egress
              readOnly: true
            {{- end }}
            {{- if .Values.gateway.mcpRegistry.servers }}
            - name: mcp-registry
              mountPath: /mcp
              readOnly: true
            {{- end }}
            {{- if and .Values.gateway.openai.upstream .Values.gateway.openai.caConfigMap }}
            - name: openai-ca
              mountPath: /openai-ca
              readOnly: true
            {{- end }}
      volumes:
        # readOnlyRootFilesystem leaves SQLite nowhere to put temp files.
        - name: tmp
          emptyDir: {}
        {{- if .Values.auth.existingSecret }}
        - name: auth
          secret:
            secretName: {{ .Values.auth.existingSecret }}
        {{- end }}
        - name: policies
          configMap:
            name: {{ .Release.Name }}-policies
        {{- if .Values.gateway.egress.enabled }}
        - name: egress
          configMap:
            name: {{ .Release.Name }}-egress
        {{- end }}
        {{- if .Values.gateway.mcpRegistry.servers }}
        - name: mcp-registry
          configMap:
            name: {{ .Release.Name }}-mcp-registry
        {{- end }}
        {{- if and .Values.gateway.openai.upstream .Values.gateway.openai.caConfigMap }}
        - name: openai-ca
          configMap:
            name: {{ .Values.gateway.openai.caConfigMap }}
        {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
