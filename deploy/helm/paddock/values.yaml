image:
  # Public images so `helm install` works out of the box. A private
  # deployment overrides these (see the Argo values) to pull from an
  # in-cluster registry; the defaults are what a first-time user gets.
  repository: ghcr.io/viktorwelbers/paddock
  tag: latest
  pullPolicy: IfNotPresent

# Image spawned inside session sandboxes (Claude Code preinstalled).
agentImage: ghcr.io/viktorwelbers/agent-claude:latest
# Image for the pi agent (OpenAI-compatible models through the gateway).
# Empty = `paddock run pi` is rejected. Requires gateway.openai.upstream.
agentImagePi: ""

# Where session sandboxes are allowed to run. A sandbox executes code an LLM
# wrote, so most clusters want them somewhere specific rather than next to
# everything else. Taint a node pool and pin them to it:
#
#   nodeSelector: {paddock.dev/agents: "true"}
#   tolerations:
#     - key: paddock.dev/agents
#       operator: Exists
#       effect: NoSchedule
#
# runtimeClassName is the stronger-isolation seam: set it to gvisor (or kata)
# on a cluster with that runtime installed and sandboxes get a syscall
# boundary instead of a namespace one. Nothing here affects the control plane
# — its own scheduling knobs are at the bottom of this file.
sandbox:
  nodeSelector: {}
  tolerations: []
  runtimeClassName: ""
  priorityClassName: ""

# Who may call the control-plane API. Sandboxes cannot reach it at all (their
# NetworkPolicy is port-scoped to the gateway), so this is about humans and CI
# on your network.
#
# There is no default: paddock's claim is that it can tell you who did what,
# and a server that accepts anyone cannot. Pick one.
#
#   existingSecret: name of a Secret with key tokens.json —
#     {"users":[{"token":"...","subject":"viktor","groups":["paddock-admin"]}]}
#     A subject owns the sessions it creates; paddock-admin sees everyone's.
#
#   disabled: true — no authentication whatsoever. Every caller owns every
#     session and can pull anyone's workspace. For a laptop or a k3d loop.
auth:
  existingSecret: ""
  disabled: false

server:
  port: 8080
  # Dev convenience: seed a 'default' budget with this USD limit (0 disables).
  seedBudgetUSD: 25
  # Size cap of the sandbox /workspace emptyDir (the developer's uploaded files
  # plus whatever the agent installs into it).
  workspaceSizeLimit: 2Gi
  # Absolute lifetime of a session. Past this, the sandbox is torn down and the
  # session's token stops working — so an idle sandbox cannot hold a credential
  # or burn compute indefinitely. A Go duration ("24h", "8h", "90m"); empty
  # disables it, and a session then lives until `paddock rm`. Blunt on purpose:
  # a coding sandbox is ephemeral, and this caps standing exposure and cost.
  maxSessionAge: "24h"
  resources: {}

gateway:
  port: 8081
  upstreamAnthropic: https://api.anthropic.com
  # Name of an existing Secret with key ANTHROPIC_API_KEY. The real provider
  # key lives only here — never inside sandboxes.
  #
  # Empty disables the /anthropic path entirely, which is the right setting
  # for a deployment that only serves self-hosted models: set
  # gateway.openai.upstream instead. One of the two is required.
  existingSecret: paddock-anthropic
  # OpenAI-compatible upstream (vLLM, llama.cpp, ...) for agents like pi.
  openai:
    # e.g. https://vllm.example.com — empty disables the /openai proxy path.
    upstream: ""
    # Model id the upstream serves; pinned into pi sandboxes.
    model: ""
    # Optional Secret with key OPENAI_API_KEY (self-hosted upstreams are
    # often keyless — leave empty to send no credentials upstream).
    existingSecret: ""
    # Optional ConfigMap with key ca.crt when the upstream sits behind a
    # private CA (e.g. cert-manager's ca-issuer).
    caConfigMap: ""
  resources: {}
  # Governed internet door for sandboxes: an HTTP CONNECT proxy that tunnels
  # TLS end-to-end (no interception) and only to allowlisted domains. Every
  # allow, deny, and connection close is audited. Default-deny: with an empty
  # allowlist the proxy runs and refuses everything.
  egress:
    enabled: true
    port: 8082
    # CONNECT target ports the proxy will dial.
    allowedPorts: [443]
    # Permit plain (non-CONNECT) http:// proxying. Off by default — every
    # registry worth reaching is https, and plaintext is exfil-friendly.
    plainHTTP: false
    # Private ranges (RFC1918/CGNAT/ULA) a resolved host may land in. Empty
    # keeps them all blocked, which is what stops a rebound DNS name from
    # reaching the kube API, the metadata service, or another namespace.
    # In-cluster model upstreams go through the gateway's /openai path, not
    # this proxy, so operators normally leave this empty.
    allowedPrivateCIDRs: []
    # Domain groups a sandbox may reach. Group names are what the OPA policy
    # (policies/egress.rego) and the audit trail see. A pattern is an exact
    # host or "*.example.com" (sub-domains only, never the apex).
    allowlist:
      groups: {}
      # groups:
      #   package_registries:
      #     - registry.npmjs.org
      #     - pypi.org
      #     - files.pythonhosted.org
      #     - proxy.golang.org
      #     - sum.golang.org
      #     - crates.io
      #     - static.crates.io
      #     - index.crates.io
      #   github:
      #     - github.com
      #     - "*.github.com"
      #     - codeload.github.com
      #     - objects.githubusercontent.com
  # Server-side MCP allowlist. Empty = MCP disabled. Each entry becomes part
  # of /mcp/registry.json; credential_env names a key in credentialsSecret.
  mcpRegistry:
    servers: []
    # servers:
    #   - name: github
    #     url: https://mcp.example.internal/github
    #     credential_env: GITHUB_MCP_TOKEN
    credentialsSecret: ""

# Expose the server API (session CRUD) outside the cluster.
ingress:
  enabled: false
  className: traefik
  host: paddock.internal
  annotations: {}
  tls:
    enabled: false

# SQLite lives on a shared volume between the server and gateway containers.
# emptyDir is fine for evaluation; set persistence.enabled for anything real.
persistence:
  enabled: false
  size: 1Gi
  storageClassName: ""

# Standard scheduling and registry knobs for the control-plane pod.
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
serviceAccount:
  # e.g. workload identity / IRSA annotations
  annotations: {}
